<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<title>UML - Prog2 Integrador</title>
<style>
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0f14;
    --grid: #ffffff0f;
    --panel: #161b22;
    --panel-hover: #1f2731;
    --border: #2b3644;
    --text: #e6edf3;
    --muted: #9aa7b4;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #eef1f5;
    --grid: #00000008;
    --panel: #ffffff;
    --panel-hover: #e9eef4;
    --border: #d3d9e0;
    --text: #26313d;
    --muted: #5b6672;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #viewport {
    position: fixed; inset: 0; overflow: hidden; cursor: grab;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    transition: background-color .15s ease;
  }
  #viewport.dragging { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage img { display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .panel {
    position: fixed; display: flex; gap: 6px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 4px 16px #00000033; font: 13px/1.2 system-ui, sans-serif; color: var(--text); z-index: 10;
  }
  #panel { top: 12px; right: 12px; padding: 6px 8px; }
  .panel button {
    min-width: 32px; height: 30px; border: 1px solid var(--border); background: transparent; border-radius: 7px;
    cursor: pointer; font: 13px system-ui, sans-serif; color: var(--text);
  }
  .panel button:hover { background: var(--panel-hover); }
  #zoomLabel { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  #help {
    top: 12px; left: 12px; max-width: 340px; padding: 10px 12px;
    font: 12.5px/1.5 system-ui, sans-serif; color: var(--muted); position: fixed;
  }
  #help b { color: var(--text); }
  #help .close { position: absolute; top: 6px; right: 8px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 15px; }
  #help kbd {
    background: var(--panel-hover); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font-size: 11px; color: var(--text);
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <img id="diagram" src="uml-dark.svg" alt="Diagrama UML">
  </div>
</div>

<div id="help" class="panel">
  <button class="close" title="Cerrar">×</button>
  <b>Navegar el diagrama</b><br>
  Rueda del mouse: zoom en el punto del cursor.<br>
  Arrastrar: mover el diagrama.<br>
  Doble clic: acercar.<br>
  <kbd>+</kbd> <kbd>-</kbd> zoom · <kbd>0</kbd> ajustar · <kbd>1</kbd> tamaño real · <kbd>D</kbd> tema
</div>

<div id="panel" class="panel">
  <button id="theme" title="Cambiar tema (D)">☀</button>
  <button id="zoomOut" title="Alejar">−</button>
  <span id="zoomLabel">100%</span>
  <button id="zoomIn" title="Acercar">+</button>
  <button id="fit" title="Ajustar a pantalla">Ajustar</button>
  <button id="actual" title="Tamaño real">1:1</button>
</div>

<script>
(function () {
  const root = document.documentElement;
  const viewport = document.getElementById('viewport');
  const stage = document.getElementById('stage');
  const img = document.getElementById('diagram');
  const label = document.getElementById('zoomLabel');
  const themeButton = document.getElementById('theme');

  // Tamaño de cada render (docs/uml.svg y docs/uml-dark.svg tienen layouts distintos).
  const SIZES = {
    dark:  { w: 6562.90576171875, h: 2884 },
    light: { w: 6421.57275390625, h: 2626 }
  };
  const FILES = { dark: 'uml-dark.svg', light: 'uml.svg' };

  let theme = 'dark';
  let width = SIZES.dark.w;
  let height = SIZES.dark.h;
  let scale = 1, tx = 0, ty = 0;
  let fitted = false;

  function apply() {
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    label.textContent = Math.round(scale * 100) + '%';
    stage.style.width = width + 'px';
    stage.style.height = height + 'px';
    img.style.width = width + 'px';
    img.style.height = height + 'px';
  }

  function centerOn(worldX, worldY) {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    tx = vw / 2 - worldX * scale;
    ty = vh / 2 - worldY * scale;
  }

  function fit() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    scale = Math.min(vw / width, vh / height) * 0.97;
    tx = (vw - width * scale) / 2;
    ty = (vh - height * scale) / 2;
    apply();
  }

  function actualSize() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    scale = 1;
    centerOn(width / 2, height / 2);
    apply();
  }

  function zoomAt(x, y, factor) {
    const next = Math.min(60, Math.max(0.03, scale * factor));
    const wx = (x - tx) / scale;
    const wy = (y - ty) / scale;
    scale = next;
    tx = x - wx * scale;
    ty = y - wy * scale;
    apply();
  }

  function setTheme(next, remember) {
    theme = next;
    root.dataset.theme = next;
    themeButton.textContent = next === 'dark' ? '☀' : '☾';
    themeButton.title = next === 'dark' ? 'Cambiar a modo claro (D)' : 'Cambiar a modo oscuro (D)';
    const size = SIZES[next];
    width = size.w; height = size.h;
    img.src = FILES[next];
    if (remember) { try { localStorage.setItem('uml-theme', next); } catch (e) {} }
    if (fitted) {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const cx = (vw / 2 - tx) / scale;
      const cy = (vh / 2 - ty) / scale;
      centerOn(cx, cy);
    }
    apply();
  }

  img.addEventListener('load', () => {
    if (fitted) return;
    fitted = true;
    fit();
  });
  img.addEventListener('error', () => { fitted = true; fit(); });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const factor = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015));
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, factor);
  }, { passive: false });

  let dragging = false, lastX = 0, lastY = 0;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#panel, #help')) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    viewport.classList.add('dragging');
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  const endDrag = () => { dragging = false; viewport.classList.remove('dragging'); };
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  viewport.addEventListener('dblclick', (e) => {
    if (e.target.closest('#panel, #help')) return;
    const rect = viewport.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, 1.6);
  });

  // Pinch en pantallas táctiles.
  const touches = new Map();
  let pinchStart = null;
  viewport.addEventListener('touchstart', (e) => {
    for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale, tx, ty,
                     cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    }
  }, { passive: true });
  viewport.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
    if (!pinchStart || touches.size < 2) return;
    e.preventDefault();
    const [a, b] = [...touches.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const rect = viewport.getBoundingClientRect();
    const next = Math.min(60, Math.max(0.03, pinchStart.scale * (dist / pinchStart.dist)));
    const wx = (pinchStart.cx - rect.left - pinchStart.tx) / pinchStart.scale;
    const wy = (pinchStart.cy - rect.top - pinchStart.ty) / pinchStart.scale;
    scale = next;
    tx = pinchStart.cx - rect.left - wx * scale;
    ty = pinchStart.cy - rect.top - wy * scale;
    apply();
  }, { passive: false });
  viewport.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) touches.delete(t.identifier);
    if (touches.size < 2) pinchStart = null;
  });

  document.getElementById('zoomIn').onclick = () => {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, 1.25);
  };
  document.getElementById('zoomOut').onclick = () => {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, 1 / 1.25);
  };
  document.getElementById('fit').onclick = fit;
  document.getElementById('actual').onclick = actualSize;
  themeButton.onclick = () => setTheme(theme === 'dark' ? 'light' : 'dark', true);
  document.querySelector('#help .close').onclick = () => document.getElementById('help').remove();

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const r = viewport.getBoundingClientRect();
    if (e.key === '+' || e.key === '=') zoomAt(r.width / 2, r.height / 2, 1.25);
    else if (e.key === '-') zoomAt(r.width / 2, r.height / 2, 1 / 1.25);
    else if (e.key === '0') fit();
    else if (e.key === '1') actualSize();
    else if (e.key === 'd' || e.key === 'D') setTheme(theme === 'dark' ? 'light' : 'dark', true);
  });

  window.addEventListener('resize', () => {
    if (scale <= Math.min(viewport.clientWidth / width, viewport.clientHeight / height) * 1.2) fit();
  });

  let saved = null;
  try { saved = localStorage.getItem('uml-theme'); } catch (e) {}
  setTheme(saved === 'light' ? 'light' : 'dark', false);
  apply();
  if (img.complete) { fitted = true; fit(); }
})();
</script>
</body>
</html>
