context: |
  Este es un proyecto Java para una concesionaria de vehículos.
  - Base de datos: SQL Server corriendo en Docker/Podman
  - Lenguaje: Java (sin frameworks, JDBC directo)
  - Estructura: src/concesionaria/{modelo,repositorio,servicio,config}
  - Scripts de ejecución: run.ps1 (Windows), run.sh (Linux/Mac)
  - Todos los artefactos deben estar en español
  - Mantener compatibilidad con Windows y Linux

